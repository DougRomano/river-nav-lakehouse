# Databricks Automation Bundle (formerly Asset Bundles)
# Docs: https://docs.databricks.com/dev-tools/bundles/
bundle:
  name: river_nav_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this environment
    default: river_nav_dev
  schema_prefix:
    description: Prefix for bronze/silver/gold schemas
    default: nav
  raw_volume:
    description: Volume path where the collector lands raw files
    default: /Volumes/river_nav_dev/nav_raw/landing
  collector_pause:
    description: PAUSED or UNPAUSED for the collector schedule
    default: PAUSED
  include_usace:
    description: Collect Corps Locks and Waterway Locks in the job. "false" on a workspace that cannot reach USACE/BTS (Free Edition); then use scripts/upload_raw.sh
    default: "true"

targets:
  dev:
    # Doug's own Azure subscription. 00_check_egress (2026-10-28): all sources reachable.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616698817750.10.azuredatabricks.net   # your workspace URL, up to .net

  test:
    workspace:
      host: https://adb-REPLACE_ME.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: river_nav_test
      raw_volume: /Volumes/river_nav_test/nav_raw/landing

  prod:
    mode: production
    workspace:
      host: https://adb-REPLACE_ME.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: river_nav
      raw_volume: /Volumes/river_nav/nav_raw/landing
      collector_pause: UNPAUSED
    run_as:
      # Use a service principal for prod, never a personal account
      service_principal_name: REPLACE_WITH_SP_APPLICATION_ID
